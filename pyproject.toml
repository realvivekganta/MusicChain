# Python package, dependencies and development-tool configuration.

# --- Build backend -----------------------------------------------------------
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# --- Application package and runtime dependencies -----------------------------
[project]
name = "chinook-support"
version = "0.1.0"
description = "Customer-scoped Chinook support agent for local LangSmith Studio"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langsmith>=0.4,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
]

# --- Local Studio and test tooling -------------------------------------------
[project.optional-dependencies]
dev = ["langgraph-cli[inmem]>=0.4,<1", "pytest>=8,<10", "ruff>=0.12,<1"]

# --- Package discovery: application and developer commands --------------------
[tool.setuptools.packages.find]
where = ["src"]
include = ["agent", "agent.*", "scripts", "scripts.*", "evals", "evals.*"]
namespaces = false

# --- Test discovery ----------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# --- Code formatting and lint rules -------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
